<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create a TaskBoard account - Kanban Project Management">
  <title>Register – TaskBoard</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="auth-page">

  <div class="auth-card">
    <div class="auth-brand">
      <div class="brand-icon">T</div>
      <div class="brand-title" style="color: var(--text-main);">TaskBoard</div>
      <span class="brand-badge">Kanban</span>
    </div>

    <div class="auth-header">
      <h1>Create your account</h1>
      <p>Start organizing and managing your projects effortlessly</p>
    </div>

    <div id="auth-alert" style="display: none; padding: 10px 14px; border-radius: var(--radius-md); font-size: 13px; margin-bottom: 16px; background-color: var(--danger-light); color: var(--danger); border: 1px solid var(--danger-border);"></div>

    <form id="register-form" class="auth-form" novalidate>
      <div class="form-group">
        <label for="name" class="form-label">Full Name</label>
        <input type="text" id="name" class="form-input" placeholder="e.g. Alex Morgan" required autocomplete="name">
      </div>

      <div class="form-group">
        <label for="email" class="form-label">Email Address</label>
        <input type="email" id="email" class="form-input" placeholder="name@company.com" required autocomplete="email">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <input type="password" id="password" class="form-input" placeholder="Min. 6 chars" required autocomplete="new-password">
        </div>

        <div class="form-group">
          <label for="confirmPassword" class="form-label">Confirm Password</label>
          <input type="password" id="confirmPassword" class="form-input" placeholder="Repeat password" required autocomplete="new-password">
        </div>
      </div>

      <button type="submit" id="submit-btn" class="btn btn-primary" style="width: 100%; padding: 10px; margin-top: 8px;">
        <span id="btn-text">Create Account</span>
      </button>
    </form>

    <div class="auth-footer">
      Already have an account? <a href="login.html">Sign in here</a>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
